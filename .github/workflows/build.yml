name: Build RasFocus PC

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        id: npm_install
        shell: pwsh
        run: npm install 2>&1 | Tee-Object -FilePath npm-install.log
        continue-on-error: true

      - name: Build Tauri app
        id: tauri_build
        shell: pwsh
        run: |
          npm run tauri build 2>&1 | Tee-Object -FilePath tauri-build.log
        continue-on-error: true

      - name: Collect and upload error log
        if: steps.npm_install.outcome == 'failure' || steps.tauri_build.outcome == 'failure'
        shell: pwsh
        run: |
          $timestamp = Get-Date -Format "yyyy-MM-dd_HH-mm-ss"
          $sha = "${{ github.sha }}".Substring(0, 7)
          $logFile = "build-logs/error_run${{ github.run_number }}_${sha}_${timestamp}.txt"
          New-Item -ItemType Directory -Force -Path "build-logs" | Out-Null

          @"
================================================================
RasFocus PC — Build Error Log
================================================================
Run     : #${{ github.run_number }}
SHA     : ${{ github.sha }}
Branch  : ${{ github.ref_name }}
Actor   : ${{ github.actor }}
Time    : $timestamp
OS      : ${{ runner.os }}
================================================================
STEP RESULTS:
  npm_install  -> ${{ steps.npm_install.outcome }}
  tauri_build  -> ${{ steps.tauri_build.outcome }}

================================================================
NODE / NPM INSTALL LOG:
================================================================
"@ | Out-File $logFile -Encoding utf8

          if (Test-Path "npm-install.log") {
            Get-Content "npm-install.log" | Out-File $logFile -Append -Encoding utf8
          }

          @"

================================================================
TAURI / CARGO BUILD LOG:
================================================================
"@ | Out-File $logFile -Append -Encoding utf8

          if (Test-Path "tauri-build.log") {
            Get-Content "tauri-build.log" | Out-File $logFile -Append -Encoding utf8
          }

          # Also grab any cargo stderr logs
          Get-ChildItem "src-tauri/target" -Recurse -Filter "*.log" -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 3 | ForEach-Object {
              "`n--- $($_.FullName) ---" | Out-File $logFile -Append -Encoding utf8
              Get-Content $_.FullName -Tail 80 | Out-File $logFile -Append -Encoding utf8
            }

          @"

================================================================
ENVIRONMENT:
================================================================
Node  : $(node --version)
NPM   : $(npm --version)
Rust  : $(rustc --version 2>&1)
Cargo : $(cargo --version 2>&1)
"@ | Out-File $logFile -Append -Encoding utf8

          # Commit to repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin ${{ github.ref_name }} 2>&1
          git add build-logs/
          git commit -m "ci: error log run #${{ github.run_number }} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload installer as artifact
        if: steps.tauri_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: RasFocusPC-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Create GitHub Release
        if: steps.tauri_build.outcome == 'success' && startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'RasFocus PC ${{ github.ref_name }}'
          releaseBody: |
            ## RasFocus PC — Windows Website Blocker

            ### Features:
            - 🔞 Adult content blocker
            - 📱 Social media blocker
            - 📺 YouTube Shorts blocker
            - 🎰 Gambling site blocker
            - ✏️ Custom domain blocking
            - 🕐 Scheduled blocking

            > ⚠️ Run as Administrator to modify Windows hosts file.
          releaseDraft: false
          prerelease: false

      - name: Fail if build failed
        if: steps.npm_install.outcome == 'failure' || steps.tauri_build.outcome == 'failure'
        run: |
          echo "Build failed. Check build-logs/ in the repo."
          exit 1
