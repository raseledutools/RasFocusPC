name: Build RasFocus PC

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        id: npm_install
        shell: pwsh
        run: npm install 2>&1 | Tee-Object -FilePath npm-install.log
        continue-on-error: true

      - name: Build Tauri app
        id: tauri_build
        shell: pwsh
        run: npm run tauri build 2>&1 | Tee-Object -FilePath tauri-build.log
        continue-on-error: true

      - name: Collect and upload error log
        if: steps.npm_install.outcome == 'failure' || steps.tauri_build.outcome == 'failure'
        shell: pwsh
        run: |
          $timestamp = Get-Date -Format "yyyy-MM-dd_HH-mm-ss"
          $sha = "${{ github.sha }}".Substring(0, 7)
          $logFile = "build-logs/error_run${{ github.run_number }}_${sha}_${timestamp}.txt"
          New-Item -ItemType Directory -Force -Path "build-logs" | Out-Null

          $lines = @(
            "================================================================",
            "RasFocus PC Build Error Log",
            "================================================================",
            "Run Number  : ${{ github.run_number }}",
            "Commit SHA  : ${{ github.sha }}",
            "Branch      : ${{ github.ref_name }}",
            "Triggered by: ${{ github.actor }}",
            "Timestamp   : $timestamp",
            "Runner OS   : ${{ runner.os }}",
            "================================================================",
            "",
            "STEP RESULTS:",
            "- npm_install : ${{ steps.npm_install.outcome }}",
            "- tauri_build : ${{ steps.tauri_build.outcome }}",
            "",
            "================================================================",
            "NPM INSTALL LOG:",
            "================================================================"
          )
          $lines | Set-Content -Path $logFile -Encoding utf8

          if (Test-Path "npm-install.log") {
            Get-Content "npm-install.log" | Add-Content -Path $logFile -Encoding utf8
          } else {
            Add-Content -Path $logFile -Value "No npm install log found." -Encoding utf8
          }

          "" | Add-Content -Path $logFile -Encoding utf8
          "================================================================" | Add-Content -Path $logFile -Encoding utf8
          "CARGO / RUST BUILD LOG (last 300 lines):" | Add-Content -Path $logFile -Encoding utf8
          "================================================================" | Add-Content -Path $logFile -Encoding utf8

          if (Test-Path "tauri-build.log") {
            Get-Content "tauri-build.log" -Tail 300 | Add-Content -Path $logFile -Encoding utf8
          } else {
            "No tauri-build log found." | Add-Content -Path $logFile -Encoding utf8
          }

          Get-ChildItem "src-tauri/target" -Recurse -Filter "*.log" -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 3 | ForEach-Object {
              "" | Add-Content -Path $logFile -Encoding utf8
              "--- $($_.FullName) ---" | Add-Content -Path $logFile -Encoding utf8
              Get-Content $_.FullName -Tail 80 | Add-Content -Path $logFile -Encoding utf8
            }

          "" | Add-Content -Path $logFile -Encoding utf8
          "================================================================" | Add-Content -Path $logFile -Encoding utf8
          "ENVIRONMENT:" | Add-Content -Path $logFile -Encoding utf8
          "================================================================" | Add-Content -Path $logFile -Encoding utf8
          "Node  : $(node --version)" | Add-Content -Path $logFile -Encoding utf8
          "NPM   : $(npm --version)" | Add-Content -Path $logFile -Encoding utf8
          "Rust  : $(rustc --version 2>&1)" | Add-Content -Path $logFile -Encoding utf8
          "Cargo : $(cargo --version 2>&1)" | Add-Content -Path $logFile -Encoding utf8

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin ${{ github.ref_name }} 2>&1
          git add build-logs/
          git commit -m "ci: error log run #${{ github.run_number }} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload installer as artifact
        if: steps.tauri_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: RasFocusPC-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Create GitHub Release
        if: steps.tauri_build.outcome == 'success' && startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'RasFocus PC ${{ github.ref_name }}'
          releaseBody: |
            ## RasFocus PC - Windows Website Blocker

            ### Features:
            - Adult content blocker
            - Social media blocker
            - YouTube Shorts blocker
            - Gambling site blocker
            - Custom domain blocking
            - Scheduled blocking

            > Run as Administrator to modify Windows hosts file.
          releaseDraft: false
          prerelease: false

      - name: Fail if build failed
        if: steps.npm_install.outcome == 'failure' || steps.tauri_build.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Host "Build failed. Check build-logs/ in the repo."
          exit 1
