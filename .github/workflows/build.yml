name: Build RasFocus PC

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        id: npm_install
        shell: pwsh
        run: npm install 2>&1 | Tee-Object -FilePath npm-install.log
        continue-on-error: true

      - name: Build Tauri app
        id: tauri_build
        uses: tauri-apps/tauri-action@v0
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'RasFocus PC ${{ github.ref_name }}'
          releaseBody: |
            ## RasFocus PC — Windows Website Blocker

            ### What's included:
            - 🔞 Adult content blocker
            - 📱 Social media blocker (Facebook, Instagram, TikTok, Twitter, Reddit...)
            - 📺 YouTube Shorts blocker
            - 🎰 Gambling site blocker
            - ✏️ Custom domain blocking
            - 🕐 Scheduled blocking

            ### Installation:
            1. Download the `.exe` (NSIS installer) or `.msi` below
            2. Right-click → **Run as Administrator**
            3. Install and launch

            > ⚠️ **Must run as Administrator** to modify the Windows hosts file.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false

      - name: Collect error logs
        if: failure() || steps.npm_install.outcome == 'failure' || steps.tauri_build.outcome == 'failure'
        shell: pwsh
        run: |
          $timestamp = Get-Date -Format "yyyy-MM-dd_HH-mm-ss"
          $runNumber = "${{ github.run_number }}"
          $sha = "${{ github.sha }}".Substring(0, 7)
          $logFile = "build-logs/error_run${runNumber}_${sha}_${timestamp}.txt"

          New-Item -ItemType Directory -Force -Path "build-logs" | Out-Null

          $content = @"
          ================================================================
          RasFocus PC Build Error Log
          ================================================================
          Run Number  : ${{ github.run_number }}
          Commit SHA  : ${{ github.sha }}
          Branch      : ${{ github.ref_name }}
          Triggered by: ${{ github.actor }}
          Timestamp   : $timestamp
          Runner OS   : ${{ runner.os }}
          ================================================================

          STEP RESULTS:
          - npm_install : ${{ steps.npm_install.outcome }}
          - tauri_build : ${{ steps.tauri_build.outcome }}

          ================================================================
          NPM INSTALL LOG:
          ================================================================
          "@
          $content | Out-File -FilePath $logFile -Encoding utf8

          if (Test-Path "npm-install.log") {
            Get-Content "npm-install.log" | Out-File -FilePath $logFile -Append -Encoding utf8
          } else {
            "No npm install log found." | Out-File -FilePath $logFile -Append -Encoding utf8
          }

          @"

          ================================================================
          CARGO / RUST BUILD LOG:
          ================================================================
          "@ | Out-File -FilePath $logFile -Append -Encoding utf8

          $cargoLogs = Get-ChildItem -Path "src-tauri/target" -Recurse -Filter "*.log" -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 5
          foreach ($log in $cargoLogs) {
            "--- $($log.FullName) ---" | Out-File -FilePath $logFile -Append -Encoding utf8
            Get-Content $log.FullName -Tail 100 | Out-File -FilePath $logFile -Append -Encoding utf8
          }
          if ($cargoLogs.Count -eq 0) {
            "No cargo log files found." | Out-File -FilePath $logFile -Append -Encoding utf8
          }

          @"

          ================================================================
          ENVIRONMENT:
          ================================================================
          "@ | Out-File -FilePath $logFile -Append -Encoding utf8

          "Node: $(node --version)" | Out-File -FilePath $logFile -Append -Encoding utf8
          "NPM : $(npm --version)" | Out-File -FilePath $logFile -Append -Encoding utf8
          "Rust: $(rustc --version 2>&1)" | Out-File -FilePath $logFile -Append -Encoding utf8
          "Cargo: $(cargo --version 2>&1)" | Out-File -FilePath $logFile -Append -Encoding utf8

          Write-Host "Log written: $logFile"

      - name: Upload error log to repo
        if: failure() || steps.npm_install.outcome == 'failure' || steps.tauri_build.outcome == 'failure'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin ${{ github.ref_name }} 2>&1 | Write-Host
          git add build-logs/
          git commit -m "ci: error log — run #${{ github.run_number }} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail job if build failed
        if: steps.npm_install.outcome == 'failure' || steps.tauri_build.outcome == 'failure'
        run: exit 1
