name: Build & Release RasFocus PC

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: false
          key: rust-v5

      - name: Read version from Cargo.toml
        id: get_version
        shell: pwsh
        run: |
          $ver = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT
          echo "Version: $ver"

      - name: Install frontend dependencies
        id: npm_install
        shell: pwsh
        run: npm install 2>&1 | Tee-Object -FilePath npm-install.log
        continue-on-error: true

      - name: Build Tauri app (NSIS only)
        id: tauri_build
        shell: pwsh
        run: npm run tauri build -- --bundles nsis 2>&1 | Tee-Object -FilePath tauri-build.log
        continue-on-error: true

      - name: Collect and upload error log
        if: steps.npm_install.outcome == 'failure' || steps.tauri_build.outcome == 'failure'
        shell: pwsh
        run: |
          $timestamp = Get-Date -Format "yyyy-MM-dd_HH-mm-ss"
          $sha = "${{ github.sha }}".Substring(0, 7)
          $logFile = "build-logs/error_run${{ github.run_number }}_${sha}_${timestamp}.txt"
          New-Item -ItemType Directory -Force -Path "build-logs" | Out-Null

          $lines = @(
            "================================================================",
            "RasFocus PC Build Error Log",
            "================================================================",
            "Run Number  : ${{ github.run_number }}",
            "Commit SHA  : ${{ github.sha }}",
            "Branch      : ${{ github.ref_name }}",
            "Triggered by: ${{ github.actor }}",
            "Timestamp   : $timestamp",
            "Runner OS   : ${{ runner.os }}",
            "================================================================",
            "",
            "STEP RESULTS:",
            "- npm_install : ${{ steps.npm_install.outcome }}",
            "- tauri_build : ${{ steps.tauri_build.outcome }}",
            "",
            "================================================================",
            "NPM INSTALL LOG:",
            "================================================================"
          )
          $lines | Set-Content -Path $logFile -Encoding utf8

          if (Test-Path "npm-install.log") {
            Get-Content "npm-install.log" | Add-Content -Path $logFile -Encoding utf8
          } else {
            Add-Content -Path $logFile -Value "No npm install log found." -Encoding utf8
          }

          "" | Add-Content -Path $logFile -Encoding utf8
          "================================================================" | Add-Content -Path $logFile -Encoding utf8
          "CARGO / RUST BUILD LOG (last 300 lines):" | Add-Content -Path $logFile -Encoding utf8
          "================================================================" | Add-Content -Path $logFile -Encoding utf8

          if (Test-Path "tauri-build.log") {
            Get-Content "tauri-build.log" -Tail 300 | Add-Content -Path $logFile -Encoding utf8
          } else {
            "No tauri-build log found." | Add-Content -Path $logFile -Encoding utf8
          }

          Get-ChildItem "src-tauri/target" -Recurse -Filter "*.log" -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 3 | ForEach-Object {
              "" | Add-Content -Path $logFile -Encoding utf8
              "--- $($_.FullName) ---" | Add-Content -Path $logFile -Encoding utf8
              Get-Content $_.FullName -Tail 80 | Add-Content -Path $logFile -Encoding utf8
            }

          "" | Add-Content -Path $logFile -Encoding utf8
          "================================================================" | Add-Content -Path $logFile -Encoding utf8
          "ENVIRONMENT:" | Add-Content -Path $logFile -Encoding utf8
          "================================================================" | Add-Content -Path $logFile -Encoding utf8
          "Node  : $(node --version)" | Add-Content -Path $logFile -Encoding utf8
          "NPM   : $(npm --version)" | Add-Content -Path $logFile -Encoding utf8
          "Rust  : $(rustc --version 2>&1)" | Add-Content -Path $logFile -Encoding utf8
          "Cargo : $(cargo --version 2>&1)" | Add-Content -Path $logFile -Encoding utf8

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin ${{ github.ref_name }} 2>&1
          git add build-logs/
          git commit -m "ci: error log run #${{ github.run_number }} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

      - name: Publish / update GitHub Release
        if: steps.tauri_build.outcome == 'success'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repo    = "${{ github.repository }}"
          $version = "${{ steps.get_version.outputs.VERSION }}"
          $tag     = "v${version}"
          $sha     = "${{ github.sha }}".Substring(0, 7)
          $runNum  = "${{ github.run_number }}"

          # Find the single NSIS exe
          $exeFile = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -ErrorAction SilentlyContinue |
                     Select-Object -First 1
          if (-not $exeFile) {
            Write-Error "No NSIS .exe found in bundle/nsis"
            exit 1
          }

          # Rename to fixed predictable filename
          $destExe = "RasFocusPC-setup.exe"
          Copy-Item $exeFile.FullName -Destination $destExe
          Write-Host "EXE: $($exeFile.Name) -> $destExe"

          # Delete existing release for this tag if any
          $existing = gh release view $tag --repo $repo 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Deleting existing release $tag ..."
            gh release delete $tag --repo $repo --yes --cleanup-tag 2>&1
            Start-Sleep -Seconds 3
          }

          # Create release tagged with version
          gh release create $tag `
            --repo $repo `
            --title "RasFocus PC v${version}" `
            --notes "**Version:** ${version}  |  **Build:** #${runNum}  |  **Commit:** ${sha}\`n\`nDownload \`\`RasFocusPC-setup.exe\`\` and run as Administrator.\`n\`nExisting installations will update automatically on next launch." `
            --latest `
            "${destExe}#RasFocusPC-setup.exe"

          Write-Host "Release $tag published."

      - name: Fail if build failed
        if: steps.npm_install.outcome == 'failure' || steps.tauri_build.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Host "Build failed. Check build-logs/ in the repo."
          exit 1
